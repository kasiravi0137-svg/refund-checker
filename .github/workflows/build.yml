name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android project
        run: |
          mkdir -p /tmp/keep
          cp pubspec.yaml /tmp/keep/ && cp lib/main.dart /tmp/keep/
          flutter create . --platforms=android --org com.example --project-name refund_checker
          cp /tmp/keep/pubspec.yaml pubspec.yaml && cp /tmp/keep/main.dart lib/main.dart
          rm -rf test
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's/version "1.7.10"/version "1.9.24"/' android/settings.gradle
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.24"/' android/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: refund-checker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
